<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title description">
  <title id="title">Esquema de base de datos de CivicFix</title>
  <desc id="description">Diagrama de las cuentas, roles y reportes compartidos por ciudadanos y administradores en una misma base de datos.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172b4d; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #52657f; }
      .db-title { font-size: 19px; font-weight: 700; fill: #ffffff; }
      .entity-title { font-size: 20px; font-weight: 700; }
      .field { font-size: 15px; }
      .muted { fill: #60738c; }
      .small { font-size: 13px; }
      .badge { font-size: 13px; font-weight: 700; }
      .card { fill: #ffffff; stroke: #cbd6e2; stroke-width: 1.5; }
      .field-line { stroke: #e7edf3; stroke-width: 1; }
      .relation { fill: none; stroke: #7187a0; stroke-width: 2.5; }
      .relation-dashed { fill: none; stroke: #e09b35; stroke-width: 2.5; stroke-dasharray: 8 7; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7187a0"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e09b35"/>
    </marker>
  </defs>

  <rect width="1440" height="1000" fill="#f3f7fb"/>
  <text x="64" y="66" class="title">Esquema de base de datos · CivicFix</text>
  <text x="64" y="98" class="subtitle">Una sola base de datos para las cuentas ciudadanas, las cuentas administradoras y los reportes.</text>

  <rect x="48" y="132" width="1344" height="728" rx="20" fill="#eaf1f8" stroke="#bfd0e0" stroke-width="2"/>
  <path d="M68 132 H1372 Q1392 132 1392 152 V190 H48 V152 Q48 132 68 132Z" fill="#24466b"/>
  <text x="76" y="169" class="db-title">BASE DE DATOS: CivicFixDb (SQL Server LocalDB por defecto)</text>
  <text x="1360" y="168" text-anchor="end" font-size="14" fill="#dce8f4">Tablas principales</text>

  <!-- Users -->
  <rect x="86" y="228" width="374" height="310" rx="12" class="card"/>
  <path d="M98 228 H448 Q460 228 460 240 V279 H86 V240 Q86 228 98 228Z" fill="#276e9b"/>
  <text x="108" y="261" font-size="20" font-weight="700" fill="#ffffff">AspNetUsers</text>
  <rect x="300" y="242" width="142" height="23" rx="11" fill="#dff2ff"/>
  <text x="371" y="258" text-anchor="middle" class="badge" fill="#195678">PERSONAS Y ADMIN</text>
  <text x="108" y="310" class="field"><tspan font-weight="700">PK</tspan><tspan>  Id</tspan></text>
  <line x1="106" y1="322" x2="440" y2="322" class="field-line"/>
  <text x="108" y="349" class="field">FullName</text>
  <line x1="106" y1="361" x2="440" y2="361" class="field-line"/>
  <text x="108" y="388" class="field">UserName</text>
  <line x1="106" y1="400" x2="440" y2="400" class="field-line"/>
  <text x="108" y="427" class="field">Email</text>
  <line x1="106" y1="439" x2="440" y2="439" class="field-line"/>
  <text x="108" y="466" class="field">PasswordHash <tspan class="muted">(contraseña protegida)</tspan></text>
  <line x1="106" y1="478" x2="440" y2="478" class="field-line"/>
  <text x="108" y="507" class="small muted">La cuenta es la misma; el rol define sus permisos.</text>

  <!-- User roles junction -->
  <rect x="565" y="275" width="290" height="188" rx="12" class="card"/>
  <path d="M577 275 H843 Q855 275 855 287 V326 H565 V287 Q565 275 577 275Z" fill="#617792"/>
  <text x="587" y="307" font-size="18" font-weight="700" fill="#ffffff">AspNetUserRoles</text>
  <text x="587" y="358" class="field"><tspan font-weight="700">FK</tspan><tspan>  UserId</tspan></text>
  <line x1="585" y1="370" x2="835" y2="370" class="field-line"/>
  <text x="587" y="398" class="field"><tspan font-weight="700">FK</tspan><tspan>  RoleId</tspan></text>
  <line x1="585" y1="410" x2="835" y2="410" class="field-line"/>
  <text x="587" y="440" class="small muted">Une una cuenta con uno o más roles.</text>

  <!-- Roles -->
  <rect x="970" y="275" width="330" height="188" rx="12" class="card"/>
  <path d="M982 275 H1288 Q1300 275 1300 287 V326 H970 V287 Q970 275 982 275Z" fill="#617792"/>
  <text x="992" y="307" font-size="18" font-weight="700" fill="#ffffff">AspNetRoles</text>
  <text x="992" y="358" class="field"><tspan font-weight="700">PK</tspan><tspan>  Id</tspan></text>
  <line x1="990" y1="370" x2="1280" y2="370" class="field-line"/>
  <text x="992" y="398" class="field">Name</text>
  <line x1="990" y1="410" x2="1280" y2="410" class="field-line"/>
  <text x="992" y="440" class="small muted">Valores usados: Citizen · Admin</text>

  <!-- Relationships between account and role -->
  <path d="M460 353 H555" class="relation" marker-end="url(#arrow)"/>
  <text x="507" y="340" text-anchor="middle" class="small muted">1 cuenta</text>
  <path d="M855 353 H960" class="relation" marker-end="url(#arrow)"/>
  <text x="907" y="340" text-anchor="middle" class="small muted">N roles</text>

  <!-- Reports -->
  <rect x="86" y="583" width="1214" height="228" rx="12" class="card"/>
  <path d="M98 583 H1288 Q1300 583 1300 595 V635 H86 V595 Q86 583 98 583Z" fill="#25806f"/>
  <text x="108" y="615" font-size="20" font-weight="700" fill="#ffffff">Reports</text>
  <text x="1275" y="614" text-anchor="end" font-size="14" fill="#e3fff8">Reportes ciudadanos · seguimiento administrativo</text>

  <text x="108" y="670" class="field"><tspan font-weight="700">PK</tspan><tspan>  Id</tspan><tspan class="muted"> · Folio (único)</tspan></text>
  <text x="108" y="703" class="field">Category · Description · Priority</text>
  <text x="108" y="736" class="field">Location · Latitude · Longitude</text>
  <text x="108" y="769" class="field">CreatedAt · ResolvedAt</text>

  <line x1="506" y1="650" x2="506" y2="790" class="field-line"/>
  <text x="538" y="670" class="field"><tspan font-weight="700">FK lógica</tspan><tspan>  CitizenUserId</tspan></text>
  <text x="538" y="703" class="field">CitizenName · PhotoPath</text>
  <text x="538" y="736" class="field">Status · Crew</text>
  <text x="538" y="769" class="small muted">La foto se guarda como archivo; aquí queda su ruta.</text>

  <rect x="952" y="650" width="310" height="137" rx="10" fill="#f0f8f6" stroke="#c6e4dc"/>
  <text x="974" y="679" font-size="15" font-weight="700" fill="#216b5d">¿QUIÉN HACE QUÉ?</text>
  <text x="974" y="710" class="field">Ciudadano: crea el reporte.</text>
  <text x="974" y="740" class="field">Admin: revisa, asigna cuadrilla</text>
  <text x="974" y="764" class="field">y actualiza el estado.</text>

  <!-- Logical link from user to report -->
  <path d="M273 538 V565 H192 V573" class="relation-dashed" marker-end="url(#arrow-orange)"/>
  <rect x="299" y="543" width="436" height="29" rx="14" fill="#fff5e5" stroke="#efd09d"/>
  <text x="517" y="563" text-anchor="middle" class="small" fill="#895611">CitizenUserId → AspNetUsers.Id · vínculo lógico (sin FK configurada)</text>

  <!-- Footer -->
  <rect x="48" y="884" width="1344" height="76" rx="14" fill="#ffffff" stroke="#d7e1eb"/>
  <circle cx="78" cy="922" r="8" fill="#276e9b"/>
  <text x="98" y="928" class="field">Admin y ciudadano comparten la misma base; sus permisos se distinguen mediante roles.</text>
  <text x="1360" y="928" text-anchor="end" class="small muted">Identity también crea tablas auxiliares de acceso y autenticación.</text>
</svg>
